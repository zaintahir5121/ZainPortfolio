<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presentation Evaluation Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1e3a5f, #1e40af);
      padding: 20px 28px;
      border-bottom: 2px solid #2563eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #fff; }
    header p  { font-size: 12px; color: #93c5fd; margin-top: 2px; }
    .save-indicator {
      font-size: 11px;
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .save-indicator.show { opacity: 1; }

    /* NAV TABS */
    .tabs {
      display: flex;
      gap: 3px;
      padding: 14px 28px 0;
      background: #0b1120;
      border-bottom: 2px solid #1e293b;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 9px 20px;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      background: #1e293b;
      color: #64748b;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active  { background: #1d4ed8; color: #fff; }
    .tab-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }

    /* LAYOUT */
    .container { padding: 20px 28px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar-right { display: flex; gap: 8px; }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { background: #1e293b; color: #94a3b8; border: 1px solid #2d3f55; }
    .btn-ghost:hover { background: #334155; color: #e2e8f0; }
    .btn-danger { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .btn-danger:hover { background: #7f1d1d; color: #fff; }

    /* PERSON SELECTOR */
    .person-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .person-chip {
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      background: #1e293b;
      color: #64748b;
      border: 1px solid #2d3f55;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .person-chip.active   { background: #1d4ed8; color: #fff; border-color: #3b82f6; }
    .person-chip.group-1  { border-left: 3px solid #3b82f6; }
    .person-chip.group-2  { border-left: 3px solid #4ade80; }
    .person-chip:hover:not(.active) { background: #334155; color: #e2e8f0; }

    /* EVAL PANEL */
    .eval-panel {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 14px;
      overflow: hidden;
    }

    .eval-header {
      padding: 18px 24px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .eval-name { font-size: 17px; font-weight: 700; color: #f1f5f9; }
    .phase-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 10px;
    }
    .group-1 { background: #1e3a5f; color: #60a5fa; }
    .group-2 { background: #052e16; color: #4ade80; }

    .overall-badge {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
    }
    .overall-badge small { font-size: 12px; font-weight: 400; color: #64748b; }

    /* CRITERIA GRID */
    .criteria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1px;
      background: #1e293b;
    }

    .criterion-card {
      background: #111827;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .criterion-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .criterion-title .short {
      color: #60a5fa;
      margin-right: 6px;
    }
    .criterion-desc {
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }

    /* STARS */
    .stars { display: flex; gap: 4px; }
    .star {
      font-size: 22px;
      cursor: pointer;
      color: #2d3f55;
      transition: color 0.1s, transform 0.1s;
      user-select: none;
      line-height: 1;
    }
    .star.filled { color: #f59e0b; }
    .star:hover  { color: #fbbf24; transform: scale(1.15); }

    .star-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      min-height: 16px;
    }

    /* REASON INPUT */
    .reason-input {
      width: 100%;
      background: #0b1120;
      border: 1px solid #2d3f55;
      border-radius: 8px;
      color: #fde047;
      font-size: 12px;
      padding: 7px 10px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .reason-input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245,158,11,0.15);
    }
    .reason-input::placeholder { color: #475569; }

    /* THOUGHT INPUT */
    .thought-input {
      width: 100%;
      background: #0b1120;
      border: 1px solid #2d3f55;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 8px 10px;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
      placeholder-color: #334155;
    }
    .thought-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
    }
    .thought-label {
      font-size: 11px;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* GENERAL NOTES */
    .general-notes-wrap {
      padding: 18px 20px;
      border-top: 1px solid #1e293b;
    }
    .general-notes-label {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .general-notes-input {
      width: 100%;
      background: #0b1120;
      border: 1px solid #2d3f55;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      min-height: 72px;
      font-family: inherit;
      line-height: 1.6;
      transition: border-color 0.2s;
    }
    .general-notes-input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    /* NAVIGATION ARROWS */
    .nav-arrows {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      border-top: 1px solid #1e293b;
      background: #0f1623;
    }
    .nav-arrows button { min-width: 100px; }

    /* SUMMARY */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .summary-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .summary-card:hover { border-color: #3b82f6; }

    .s-name { font-size: 15px; font-weight: 700; color: #f1f5f9; margin-bottom: 12px; }

    .session-block { margin-bottom: 14px; }
    .session-heading {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #1e293b;
    }
    .s1-heading { color: #60a5fa; }
    .s2-heading { color: #4ade80; }

    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .bar-label { font-size: 11px; color: #94a3b8; width: 140px; flex-shrink: 0; line-height: 1.3; }
    .bar-track { flex: 1; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
    .bar-fill-s1 { background: linear-gradient(90deg, #1d4ed8, #60a5fa); }
    .bar-fill-s2 { background: linear-gradient(90deg, #065f46, #34d399); }
    .bar-val  { font-size: 11px; font-weight: 700; color: #94a3b8; width: 16px; text-align: right; }

    .overall-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }
    .overall-lbl { font-size: 12px; color: #64748b; font-weight: 600; }
    .overall-num { font-size: 24px; font-weight: 800; color: #fff; }
    .overall-num small { font-size: 12px; font-weight: 400; color: #475569; }

    .card-notes {
      margin-top: 10px;
      padding: 8px 10px;
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 6px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .card-notes b { font-weight: 700; }

    /* TABS */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* SCORE PILL */
    .score-pill {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .score-s0 { background: #1e293b; color: #475569; }
    .score-s1 { background: #450a0a; color: #fca5a5; }
    .score-s2 { background: #431407; color: #fdba74; }
    .score-s3 { background: #422006; color: #fde047; }
    .score-s4 { background: #052e16; color: #86efac; }
    .score-s5 { background: #172554; color: #93c5fd; }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .container { padding: 14px 16px; }
      .tabs { padding: 10px 16px 0; }
      .criteria-grid { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: #fff; color: #000; }
      .tabs, .toolbar, .nav-arrows, .person-selector { display: none !important; }
      .tab-content { display: block !important; }
      .eval-panel { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Presentation Evaluation Dashboard</h1>
    <p>Session 1 — Technical Observation &nbsp;·&nbsp; Session 2 — Thinking & Communication</p>
  </div>
  <span class="save-indicator" id="saveIndicator">✓ Saved</span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('s1')">Session 1 — Technical</button>
  <button class="tab-btn"        onclick="switchTab('s2')">Session 2 — Thinking</button>
  <button class="tab-btn"        onclick="switchTab('summary')">Summary View</button>
</div>

<div class="container">

  <!-- SESSION 1 -->
  <div class="tab-content active" id="tab-s1">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="person-selector" id="chips-s1"></div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" onclick="switchTab('s2')">Session 2 →</button>
      </div>
    </div>
    <div class="eval-panel" id="panel-s1"></div>
  </div>

  <!-- SESSION 2 -->
  <div class="tab-content" id="tab-s2">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="person-selector" id="chips-s2"></div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" onclick="switchTab('summary')">View Summary →</button>
      </div>
    </div>
    <div class="eval-panel" id="panel-s2"></div>
  </div>

  <!-- SUMMARY -->
  <div class="tab-content" id="tab-summary">
    <div class="toolbar">
      <div class="toolbar-left">
        <span style="font-size:13px;color:#64748b;">All participants overview</span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" onclick="buildSummary()">Refresh</button>
        <button class="btn btn-primary" onclick="window.print()">Print / Screenshot</button>
      </div>
    </div>
    <div class="summary-grid" id="summary-grid"></div>
  </div>

</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────

const PEOPLE = [
  { id:1, name:"Mohammad Kashif Mohiuddin",      group:1 },
  { id:2, name:"Shahid",                         group:1 },
  { id:3, name:"Hadeef",                         group:1 },
  { id:4, name:"Baizid Yaldram",                 group:2 },
  { id:5, name:"Muhammad Hadif Amar Bin Razali", group:2 },
  { id:6, name:"Cita Wafa Atiah",                group:2 },
  { id:7, name:"Muhammad Mairaj",                group:2 },
  { id:8, name:"Mohammad Shahid Akhtar",         group:2 },
  { id:9, name:"Aurneela Ghosh Riddhi",          group:2 },
];

const S1_CRITERIA = [
  {
    short: "TA",
    name:  "Technical Accuracy",
    desc:  "Are the technical facts, figures, and concepts presented correctly without errors or misconceptions?"
  },
  {
    short: "EC",
    name:  "Explanation Clarity",
    desc:  "Can they explain complex ideas in a way that is easy to understand and follow?"
  },
  {
    short: "PS",
    name:  "Problem Solving",
    desc:  "Do they demonstrate a clear method for identifying and resolving problems?"
  },
  {
    short: "DE",
    name:  "Demo / Examples",
    desc:  "Are their demonstrations and examples relevant, well-prepared, and effective?"
  },
  {
    short: "QA",
    name:  "Q&A Handling",
    desc:  "How confidently and accurately do they answer questions from the audience?"
  },
];

const S2_CRITERIA = [
  {
    short: "CT",
    name:  "Clarity of Thought",
    desc:  "Are their ideas well-organised and easy to follow? Do they speak or present without confusion?"
  },
  {
    short: "DW",
    name:  "Depth vs Breadth",
    desc:  "Do they go deep into one area with strong detail, or do they cover many areas at a surface level — and is that the right choice for the topic?"
  },
  {
    short: "LB",
    name:  "Listing and Building",
    desc:  "Can they list key points clearly, and then build on each one with explanation, examples, or evidence?"
  },
  {
    short: "BC",
    name:  "Business Linkage",
    desc:  "Do they connect their ideas to real business impact, value, or outcomes — not just theory?"
  },
  {
    short: "CC",
    name:  "Conduit with Conduct",
    desc:  "How well do they carry and pass on information — acting as a clear bridge between ideas and audience, while maintaining professional conduct?"
  },
  {
    short: "OT",
    name:  "Original Thinking & Communication Style",
    desc:  "Do they show their own perspective and voice? Are they going beyond what was taught, with a unique way of communicating?"
  },
];

const STAR_LABELS = ["", "Very Poor (1)", "Poor (2)", "Fair (3)", "Good (4)", "Excellent (5)"];

// ─── STATE ────────────────────────────────────────────────────────────────────

function emptyState() {
  const st = { s1:{}, s2:{} };
  PEOPLE.forEach(p => {
    st.s1[p.id] = { scores: Array(5).fill(0), reasons: Array(5).fill(""), thoughts: Array(5).fill(""), notes: "" };
    st.s2[p.id] = { scores: Array(6).fill(0), reasons: Array(6).fill(""), thoughts: Array(6).fill(""), notes: "" };
  });
  return st;
}

let state = emptyState();
let currentPerson = { s1: 1, s2: 1 };

function save() {
  try {
    localStorage.setItem("evalState_v2", JSON.stringify(state));
    const ind = document.getElementById('saveIndicator');
    ind.classList.add('show');
    setTimeout(() => ind.classList.remove('show'), 1500);
  } catch(e){}
}

function load() {
  try {
    const raw = localStorage.getItem("evalState_v2");
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Merge to avoid missing keys if structure changed
    PEOPLE.forEach(p => {
      if (saved.s1 && saved.s1[p.id]) {
        const sv = saved.s1[p.id];
        state.s1[p.id].scores   = sv.scores   || state.s1[p.id].scores;
        state.s1[p.id].reasons  = sv.reasons  || state.s1[p.id].reasons;
        state.s1[p.id].thoughts = sv.thoughts  || state.s1[p.id].thoughts;
        state.s1[p.id].notes    = sv.notes     || "";
      }
      if (saved.s2 && saved.s2[p.id]) {
        const sv = saved.s2[p.id];
        state.s2[p.id].scores   = sv.scores   || state.s2[p.id].scores;
        state.s2[p.id].reasons  = sv.reasons  || state.s2[p.id].reasons;
        state.s2[p.id].thoughts = sv.thoughts  || state.s2[p.id].thoughts;
        state.s2[p.id].notes    = sv.notes     || "";
      }
    });
  } catch(e){}
}

// ─── CHIPS ────────────────────────────────────────────────────────────────────

function buildChips(session) {
  const container = document.getElementById(`chips-s${session}`);
  container.innerHTML = "";
  PEOPLE.forEach(p => {
    const chip = document.createElement('button');
    chip.className = `person-chip group-${p.group}${currentPerson[`s${session}`] === p.id ? " active" : ""}`;
    chip.textContent = p.name.split(" ")[0]; // first name only for compact display
    chip.title = p.name;
    chip.onclick = () => { currentPerson[`s${session}`] = p.id; buildChips(session); renderPanel(session); };
    container.appendChild(chip);
  });
}

// ─── PANEL ────────────────────────────────────────────────────────────────────

function scorePillClass(score, max) {
  const idx = max > 0 ? Math.round((score / max) * 5) : 0;
  return `score-s${Math.min(idx, 5)}`;
}

function renderPanel(session) {
  const pid      = currentPerson[`s${session}`];
  const person   = PEOPLE.find(p => p.id === pid);
  const sdata    = state[`s${session}`][pid];
  const criteria = session === 1 ? S1_CRITERIA : S2_CRITERIA;
  const max      = criteria.length * 5;
  const total    = sdata.scores.reduce((a,b) => a+b, 0);
  const pct      = max > 0 ? Math.round((total / max) * 100) : 0;
  const pillCls  = scorePillClass(total, max);

  const panel = document.getElementById(`panel-s${session}`);

  // Header
  let html = `
    <div class="eval-header">
      <div>
        <span class="eval-name">${person.name}</span>
        <span class="phase-badge group-${person.group}">Group ${person.group}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="overall-s${session}" class="overall-badge score-pill ${pillCls}">${pct}%</span>
        <button class="btn btn-danger" style="font-size:11px;padding:5px 10px"
          onclick="clearPerson(${session},${pid})">Clear</button>
      </div>
    </div>
    <div class="criteria-grid">
  `;

  criteria.forEach((c, ci) => {
    const score = sdata.scores[ci];
    const thought = (sdata.thoughts[ci] || "").replace(/"/g, '&quot;');
    let stars = '';
    for (let i = 1; i <= 5; i++) {
      stars += `<span class="star${i <= score ? ' filled' : ''}"
        data-key="s${session}-${pid}-${ci}"
        data-val="${i}"
        onclick="setScore(${session},${pid},${ci},${i})"
        onmouseover="hoverStars('s${session}-${pid}-${ci}',${i})"
        onmouseout="resetStars('s${session}-${pid}-${ci}',${score})">★</span>`;
    }

    html += `
      <div class="criterion-card">
        <div class="criterion-title">
          <span class="short">${c.short}</span>${c.name}
        </div>
        <div class="criterion-desc">${c.desc}</div>
        <div class="stars" id="stars-s${session}-${pid}-${ci}">${stars}</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="star-label" id="slabel-s${session}-${pid}-${ci}">${score > 0 ? STAR_LABELS[score] : 'Click to rate'}</div>
        </div>
        <div class="thought-label">Reason for score</div>
        <input type="text" class="reason-input"
          id="reason-s${session}-${pid}-${ci}"
          placeholder="Why did you give this score?"
          oninput="saveReason(${session},${pid},${ci},this.value)"
          value="${(sdata.reasons && sdata.reasons[ci] ? sdata.reasons[ci] : '').replace(/"/g,'&quot;')}">
        <div class="thought-label">Detailed observations</div>
        <textarea class="thought-input"
          id="thought-s${session}-${pid}-${ci}"
          placeholder="Write your observations, notes, or specific comments about ${c.name.toLowerCase()}…"
          oninput="saveThought(${session},${pid},${ci},this.value)">${(sdata.thoughts[ci]||'')}</textarea>
      </div>
    `;
  });

  html += `</div>`;

  // General notes
  html += `
    <div class="general-notes-wrap">
      <div class="general-notes-label">General Observations for ${person.name.split(" ")[0]}</div>
      <textarea class="general-notes-input"
        id="gnotes-s${session}-${pid}"
        placeholder="Overall impressions, standout moments, areas for improvement, anything else you want to remember…"
        oninput="saveNotes(${session},${pid},this.value)">${sdata.notes || ''}</textarea>
    </div>
  `;

  // Nav arrows
  const idx  = PEOPLE.findIndex(p => p.id === pid);
  const prev = PEOPLE[idx - 1];
  const next = PEOPLE[idx + 1];

  html += `
    <div class="nav-arrows">
      <button class="btn btn-ghost" ${!prev ? 'disabled style="opacity:0.3"' : ''}
        onclick="navigatePerson(${session}, ${prev ? prev.id : 0})">← ${prev ? prev.name.split(" ")[0] : ''}</button>
      <span style="font-size:12px;color:#475569;align-self:center">${idx+1} / ${PEOPLE.length}</span>
      <button class="btn btn-ghost" ${!next ? 'disabled style="opacity:0.3"' : ''}
        onclick="navigatePerson(${session}, ${next ? next.id : 0})">→ ${next ? next.name.split(" ")[0] : ''}</button>
    </div>
  `;

  panel.innerHTML = html;
}

function navigatePerson(session, pid) {
  if (!pid) return;
  currentPerson[`s${session}`] = pid;
  buildChips(session);
  renderPanel(session);
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────

function setScore(session, pid, ci, val) {
  state[`s${session}`][pid].scores[ci] = val;
  save();
  // Update stars in-place
  const key = `s${session}-${pid}-${ci}`;
  document.querySelectorAll(`[data-key="${key}"]`).forEach(s => {
    s.classList.toggle('filled', parseInt(s.dataset.val) <= val);
  });
  document.getElementById(`slabel-s${session}-${pid}-${ci}`).textContent = STAR_LABELS[val];
  updateOverall(session, pid);
}

function hoverStars(key, val) {
  document.querySelectorAll(`[data-key="${key}"]`).forEach(s => {
    s.classList.toggle('filled', parseInt(s.dataset.val) <= val);
  });
  const [, , pid, ci] = key.split('-');
  const labelEl = document.getElementById(`slabel-${key}`);
  if (labelEl) labelEl.textContent = STAR_LABELS[val];
}

function resetStars(key, currentVal) {
  document.querySelectorAll(`[data-key="${key}"]`).forEach(s => {
    s.classList.toggle('filled', parseInt(s.dataset.val) <= currentVal);
  });
  const labelEl = document.getElementById(`slabel-${key}`);
  if (labelEl) labelEl.textContent = currentVal > 0 ? STAR_LABELS[currentVal] : 'Click to rate';
}

function updateOverall(session, pid) {
  const sdata    = state[`s${session}`][pid];
  const criteria = session === 1 ? S1_CRITERIA : S2_CRITERIA;
  const max      = criteria.length * 5;
  const total    = sdata.scores.reduce((a,b) => a+b, 0);
  const pct      = Math.round((total / max) * 100);
  const pillCls  = scorePillClass(total, max);
  const el = document.getElementById(`overall-s${session}`);
  if (el) { el.textContent = `${pct}%`; el.className = `overall-badge score-pill ${pillCls}`; }
}

function saveThought(session, pid, ci, val) {
  state[`s${session}`][pid].thoughts[ci] = val;
  save();
}

function saveReason(session, pid, ci, val) {
  state[`s${session}`][pid].reasons[ci] = val;
  save();
}

function saveNotes(session, pid, val) {
  state[`s${session}`][pid].notes = val;
  save();
}

function clearPerson(session, pid) {
  if (!confirm("Clear all ratings and notes for this person in this session?")) return;
  const len = session === 1 ? 5 : 6;
  state[`s${session}`][pid] = { scores: Array(len).fill(0), reasons: Array(len).fill(""), thoughts: Array(len).fill(""), notes: "" };
  save();
  renderPanel(session);
}

// ─── SUMMARY ──────────────────────────────────────────────────────────────────

function buildSummary() {
  const grid = document.getElementById('summary-grid');
  grid.innerHTML = "";

  PEOPLE.forEach(p => {
    const s1 = state.s1[p.id];
    const s2 = state.s2[p.id];
    const s1total = s1.scores.reduce((a,b)=>a+b,0);
    const s2total = s2.scores.reduce((a,b)=>a+b,0);
    const overall = Math.round(((s1total/25)+(s2total/30))/2*100);

    const bars1 = S1_CRITERIA.map((c,i) => `
      <div class="bar-row">
        <div class="bar-label">${c.name}</div>
        <div class="bar-track"><div class="bar-fill bar-fill-s1" style="width:${s1.scores[i]*20}%"></div></div>
        <div class="bar-val">${s1.scores[i]}</div>
      </div>`).join('');

    const bars2 = S2_CRITERIA.map((c,i) => `
      <div class="bar-row">
        <div class="bar-label">${c.name}</div>
        <div class="bar-track"><div class="bar-fill bar-fill-s2" style="width:${s2.scores[i]*20}%"></div></div>
        <div class="bar-val">${s2.scores[i]}</div>
      </div>`).join('');

    // Collect all thoughts
    const s1thoughts = S1_CRITERIA.map((c,i) => {
      const r = s1.reasons  && s1.reasons[i]  ? `<span style="color:#fde047">Reason: ${s1.reasons[i]}</span>` : '';
      const t = s1.thoughts && s1.thoughts[i] ? s1.thoughts[i] : '';
      if (!r && !t) return '';
      return `<b>${c.short} — ${c.name}:</b> ${[r,t].filter(Boolean).join(' · ')}`;
    }).filter(Boolean).join('<br>');
    const s2thoughts = S2_CRITERIA.map((c,i) => {
      const r = s2.reasons  && s2.reasons[i]  ? `<span style="color:#fde047">Reason: ${s2.reasons[i]}</span>` : '';
      const t = s2.thoughts && s2.thoughts[i] ? s2.thoughts[i] : '';
      if (!r && !t) return '';
      return `<b>${c.short} — ${c.name}:</b> ${[r,t].filter(Boolean).join(' · ')}`;
    }).filter(Boolean).join('<br>');
    const hasNotes = s1.notes || s2.notes || s1thoughts || s2thoughts;

    const card = document.createElement('div');
    card.className = 'summary-card';
    card.innerHTML = `
      <div class="s-name">${p.name} <span class="phase-badge group-${p.group}">Group ${p.group}</span></div>

      <div class="session-block">
        <div class="session-heading s1-heading">Session 1 — Technical Observation</div>
        ${bars1}
      </div>

      <div class="session-block">
        <div class="session-heading s2-heading">Session 2 — Thinking & Communication</div>
        ${bars2}
      </div>

      <div class="overall-row">
        <div class="overall-lbl">Overall Score</div>
        <div class="overall-num">${overall}%<small> / 100</small></div>
      </div>

      ${hasNotes ? `<div class="card-notes" style="margin-top:10px">
        ${s1thoughts ? `<div style="margin-bottom:6px"><span style="color:#60a5fa;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px">S1 Thoughts</span><br>${s1thoughts}</div>` : ''}
        ${s2thoughts ? `<div style="margin-bottom:6px"><span style="color:#4ade80;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px">S2 Thoughts</span><br>${s2thoughts}</div>` : ''}
        ${s1.notes   ? `<div><span style="color:#60a5fa;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px">S1 Notes</span><br>${s1.notes}</div>` : ''}
        ${s2.notes   ? `<div style="margin-top:4px"><span style="color:#4ade80;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px">S2 Notes</span><br>${s2.notes}</div>` : ''}
      </div>` : ''}
    `;
    grid.appendChild(card);
  });
}

// ─── TABS ─────────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['s1','s2','summary'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'summary') buildSummary();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

load();
buildChips(1);
buildChips(2);
renderPanel(1);
renderPanel(2);
</script>
</body>
</html>
