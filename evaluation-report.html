<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presentation Evaluation Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      font-size: 13px;
    }

    /* ── PAGE WRAPPER ── */
    .page {
      max-width: 1100px;
      margin: 24px auto;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }

    /* ── HEADER ── */
    .report-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      padding: 28px 36px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }
    .report-header h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.3px; }
    .report-header .sub { font-size: 13px; color: #93c5fd; margin-top: 4px; }
    .report-meta { text-align: right; font-size: 12px; color: #bfdbfe; line-height: 1.7; }
    .report-meta strong { color: #fff; }

    /* ── LEGEND ── */
    .legend-bar {
      display: flex;
      gap: 0;
      background: #1e293b;
    }
    .legend-bar .leg {
      flex: 1;
      text-align: center;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .leg-5 { background: #1e3a5f; color: #93c5fd; }
    .leg-4 { background: #052e16; color: #86efac; }
    .leg-3 { background: #422006; color: #fde047; }
    .leg-2 { background: #431407; color: #fdba74; }
    .leg-1 { background: #450a0a; color: #fca5a5; }

    /* ── SECTION HEADING ── */
    .section-head {
      padding: 12px 36px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .session-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .dot-s1 { background: #3b82f6; }
    .dot-s2 { background: #22c55e; }

    /* ── PARTICIPANT ROW ── */
    .participant {
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 36px;
    }
    .participant:last-child { border-bottom: none; }

    .p-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .p-name {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .p-group {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-left: 8px;
    }
    .g1 { background: #dbeafe; color: #1d4ed8; }
    .g2 { background: #dcfce7; color: #15803d; }

    .p-scores {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* overall pill */
    .overall-pill {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }
    .ov-5 { background: #dbeafe; color: #1e40af; }
    .ov-4 { background: #dcfce7; color: #166534; }
    .ov-3 { background: #fef9c3; color: #854d0e; }
    .ov-2 { background: #ffedd5; color: #9a3412; }
    .ov-1 { background: #fee2e2; color: #991b1b; }
    .ov-0 { background: #f1f5f9; color: #94a3b8; }

    /* ── CRITERIA TABLE ── */
    .crit-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .crit-table th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    .crit-table td {
      padding: 7px 10px;
      border: 1px solid #e2e8f0;
      vertical-align: top;
      color: #334155;
    }
    .crit-table tr:nth-child(even) td { background: #f8fafc; }

    .score-cell {
      text-align: center;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      min-width: 90px;
    }
    .sc-5 { color: #1d4ed8; }
    .sc-4 { color: #15803d; }
    .sc-3 { color: #854d0e; }
    .sc-2 { color: #9a3412; }
    .sc-1 { color: #991b1b; }
    .sc-0 { color: #cbd5e1; }

    .reason-cell { color: #7c3aed; font-style: italic; }
    .thought-cell { color: #475569; }

    .no-data { color: #cbd5e1; font-style: italic; }

    /* ── OVERALL NOTES ── */
    .overall-notes {
      margin-top: 8px;
      padding: 8px 12px;
      background: #f8fafc;
      border-left: 3px solid #3b82f6;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: #334155;
      line-height: 1.6;
    }
    .overall-notes.s2 { border-left-color: #22c55e; }
    .notes-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    /* ── FOOTER ── */
    .report-footer {
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 14px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ── TOOLBAR (hidden in print) ── */
    .toolbar {
      max-width: 1100px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 4px;
    }
    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { background: #e2e8f0; color: #475569; }
    .btn-ghost:hover { background: #cbd5e1; }

    /* ── NO DATA STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: #64748b; }
    .empty-state p { font-size: 13px; }

    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .page { margin: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <button class="btn btn-ghost" onclick="window.location.href='evaluation-dashboard.html'">← Back to Dashboard</button>
  <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save as PDF</button>
</div>

<div class="page" id="report-page">

  <div class="report-header">
    <div>
      <h1>Presentation Evaluation Report</h1>
      <div class="sub">Session 1 — Technical Observation &nbsp;·&nbsp; Session 2 — Thinking & Communication</div>
    </div>
    <div class="report-meta">
      <div><strong>Date:</strong> <span id="report-date"></span></div>
      <div><strong>Participants:</strong> 9</div>
      <div><strong>Groups:</strong> Group 1 (3) &nbsp;·&nbsp; Group 2 (6)</div>
    </div>
  </div>

  <!-- Rating legend -->
  <div class="legend-bar">
    <div class="leg leg-5">★★★★★ &nbsp; Excellent (5)</div>
    <div class="leg leg-4">★★★★☆ &nbsp; Good (4)</div>
    <div class="leg leg-3">★★★☆☆ &nbsp; Fair (3)</div>
    <div class="leg leg-2">★★☆☆☆ &nbsp; Poor (2)</div>
    <div class="leg leg-1">★☆☆☆☆ &nbsp; Very Poor (1)</div>
  </div>

  <div id="report-body"></div>

  <div class="report-footer">
    <span>Evaluation Dashboard — Confidential</span>
    <span id="footer-date"></span>
  </div>
</div>

<script>
const PEOPLE = [
  { id:1, name:"Mohammad Kashif Mohiuddin",      group:1 },
  { id:2, name:"Shahid",                         group:1 },
  { id:3, name:"Hadeef",                         group:1 },
  { id:4, name:"Baizid Yaldram",                 group:2 },
  { id:5, name:"Muhammad Hadif Amar Bin Razali", group:2 },
  { id:6, name:"Cita Wafa Atiah",                group:2 },
  { id:7, name:"Muhammad Mairaj",                group:2 },
  { id:8, name:"Mohammad Shahid Akhtar",         group:2 },
  { id:9, name:"Aurneela Ghosh Riddhi",          group:2 },
];

const S1_CRITERIA = [
  { short:"TA", name:"Technical Accuracy"   },
  { short:"EC", name:"Explanation Clarity"  },
  { short:"PS", name:"Problem Solving"      },
  { short:"DE", name:"Demo / Examples"      },
  { short:"QA", name:"Q&A Handling"         },
];
const S2_CRITERIA = [
  { short:"CT", name:"Clarity of Thought"                      },
  { short:"DW", name:"Depth vs Breadth"                        },
  { short:"LB", name:"Listing and Building"                    },
  { short:"BC", name:"Business Linkage"                        },
  { short:"CC", name:"Conduit with Conduct"                    },
  { short:"OT", name:"Original Thinking & Communication Style" },
];
const SCORE_LABELS = ["—", "Very Poor", "Poor", "Fair", "Good", "Excellent"];

function emptyPerson(len) {
  return { scores: Array(len).fill(0), reasons: Array(len).fill(""), thoughts: Array(len).fill(""), notes: "" };
}

function loadState() {
  let st = { s1:{}, s2:{} };
  PEOPLE.forEach(p => { st.s1[p.id] = emptyPerson(5); st.s2[p.id] = emptyPerson(6); });
  try {
    const raw = localStorage.getItem("evalState_v2");
    if (raw) {
      const saved = JSON.parse(raw);
      PEOPLE.forEach(p => {
        ['s1','s2'].forEach(s => {
          if (saved[s] && saved[s][p.id]) {
            const sv = saved[s][p.id];
            const len = s === 's1' ? 5 : 6;
            st[s][p.id].scores   = sv.scores   || Array(len).fill(0);
            st[s][p.id].reasons  = sv.reasons  || Array(len).fill("");
            st[s][p.id].thoughts = sv.thoughts || Array(len).fill("");
            st[s][p.id].notes    = sv.notes    || "";
          }
        });
      });
    }
  } catch(e){}
  return st;
}

function scoreCls(v) { return v > 0 ? `sc-${v}` : 'sc-0'; }
function overallCls(pct) {
  if (pct >= 80) return 'ov-5';
  if (pct >= 60) return 'ov-4';
  if (pct >= 40) return 'ov-3';
  if (pct >= 20) return 'ov-2';
  if (pct > 0)   return 'ov-1';
  return 'ov-0';
}

function criteriaRows(criteria, sdata) {
  return criteria.map((c, i) => {
    const sc = sdata.scores[i] || 0;
    const reason  = (sdata.reasons  && sdata.reasons[i])  || '';
    const thought = (sdata.thoughts && sdata.thoughts[i]) || '';
    return `<tr>
      <td><b>${c.short}</b></td>
      <td>${c.name}</td>
      <td class="score-cell ${scoreCls(sc)}">${sc > 0 ? `${SCORE_LABELS[sc]} (${sc})` : '<span class="no-data">—</span>'}</td>
      <td class="reason-cell">${reason || '<span class="no-data">—</span>'}</td>
      <td class="thought-cell">${thought || '<span class="no-data">—</span>'}</td>
    </tr>`;
  }).join('');
}

function build() {
  const state = loadState();
  const body  = document.getElementById('report-body');
  const date  = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  document.getElementById('report-date').textContent  = date;
  document.getElementById('footer-date').textContent  = `Generated: ${date}`;

  let html = '';

  [1, 2].forEach(grp => {
    const members = PEOPLE.filter(p => p.group === grp);
    html += `<div class="section-head">
      <span class="session-dot dot-s${grp}"></span>
      Group ${grp} — ${members.length} Participant${members.length > 1 ? 's' : ''}
    </div>`;

    members.forEach(p => {
      const s1 = state.s1[p.id];
      const s2 = state.s2[p.id];
      const s1total = s1.scores.reduce((a,b)=>a+b,0);
      const s2total = s2.scores.reduce((a,b)=>a+b,0);
      const s1pct   = Math.round((s1total / 25) * 100);
      const s2pct   = Math.round((s2total / 30) * 100);
      const overall = Math.round((s1pct + s2pct) / 2);

      html += `<div class="participant">
        <div class="p-header">
          <div>
            <span class="p-name">${p.name}</span>
            <span class="p-group g${p.group}">Group ${p.group}</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span style="font-size:11px;color:#94a3b8">S1: <b style="color:#3b82f6">${s1pct}%</b></span>
            <span style="font-size:11px;color:#94a3b8">S2: <b style="color:#22c55e">${s2pct}%</b></span>
            <span class="overall-pill ${overallCls(overall)}">Overall: ${overall}%</span>
          </div>
        </div>

        <!-- Session 1 -->
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#3b82f6;margin-bottom:5px">
          Session 1 — Technical Observation
        </div>
        <table class="crit-table">
          <thead><tr>
            <th style="width:36px">#</th>
            <th>Criterion</th>
            <th style="width:130px">Score</th>
            <th style="width:200px">Reason for Score</th>
            <th>Detailed Observations</th>
          </tr></thead>
          <tbody>${criteriaRows(S1_CRITERIA, s1)}</tbody>
        </table>
        ${s1.notes ? `<div class="overall-notes"><div class="notes-lbl">Session 1 — General Notes</div>${s1.notes}</div>` : ''}

        <!-- Session 2 -->
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#22c55e;margin:12px 0 5px">
          Session 2 — Thinking & Communication
        </div>
        <table class="crit-table">
          <thead><tr>
            <th style="width:36px">#</th>
            <th>Criterion</th>
            <th style="width:130px">Score</th>
            <th style="width:200px">Reason for Score</th>
            <th>Detailed Observations</th>
          </tr></thead>
          <tbody>${criteriaRows(S2_CRITERIA, s2)}</tbody>
        </table>
        ${s2.notes ? `<div class="overall-notes s2"><div class="notes-lbl">Session 2 — General Notes</div>${s2.notes}</div>` : ''}
      </div>`;
    });
  });

  body.innerHTML = html || `<div class="empty-state">
    <h2>No evaluation data found</h2>
    <p>Please fill in the <a href="evaluation-dashboard.html">Evaluation Dashboard</a> first, then return here to generate the report.</p>
  </div>`;
}

build();
</script>
</body>
</html>
